<!DOCTYPE lake>
<p data-lake-id="u91bf32b1" id="u91bf32b1"><span data-lake-id="u3cf5efde" id="u3cf5efde">程序注释主要是对代码进行解释说明,并不参与程序的运行</span></p><p data-lake-id="ue1439329" id="ue1439329"><span data-lake-id="u2cb40a51" id="u2cb40a51">注释可以分为:</span><strong><span data-lake-id="u7197a9c4" id="u7197a9c4">单行注释</span></strong><span data-lake-id="u07b44307" id="u07b44307">和</span><strong><span data-lake-id="u51aaffa8" id="u51aaffa8">多行注释</span></strong></p><h2 data-lake-id="tIXqM" id="tIXqM"><span data-lake-id="u48e8eac0" id="u48e8eac0">1.单行注释</span></h2><p data-lake-id="uc9dbdbf4" id="uc9dbdbf4"><span data-lake-id="uf711c7bc" id="uf711c7bc">单行注释以#开头,#后跟上注释的内容</span></p><span class="yuque-card-unsupported">[codeblock]</span><h2 data-lake-id="IuDGO" id="IuDGO"><span data-lake-id="u3b73936b" id="u3b73936b">2.多行注释</span></h2><p data-lake-id="u9c97b41c" id="u9c97b41c"><span data-lake-id="u4a8c05d2" id="u4a8c05d2">如果注释内容比较多的话,可以使用多行注释</span></p><p data-lake-id="ud38857bd" id="ud38857bd"><span data-lake-id="u3a4e0f53" id="u3a4e0f53">多行注释以</span><code data-lake-id="u5367eaa3" id="u5367eaa3"><span data-lake-id="u02b4877d" id="u02b4877d">"""</span></code><span data-lake-id="ube55e15c" id="ube55e15c">开头，</span><code data-lake-id="u76f17a61" id="u76f17a61"><span data-lake-id="u4e72f978" id="u4e72f978">"""</span></code><span data-lake-id="u76c1f6fc" id="u76c1f6fc">结尾。（或以</span><code data-lake-id="u118660cd" id="u118660cd"><span data-lake-id="u936a90dd" id="u936a90dd">'''</span></code><span data-lake-id="u001e86b5" id="u001e86b5">开头,</span><code data-lake-id="u9e6a36ac" id="u9e6a36ac"><span data-lake-id="u4c6c354b" id="u4c6c354b">'''</span></code><span data-lake-id="u1206f6ff" id="u1206f6ff">结尾）</span></p><span class="yuque-card-unsupported">[codeblock]</span>
