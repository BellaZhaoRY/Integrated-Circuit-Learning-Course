<p data-lake-id="ud2c8bea8" id="ud2c8bea8"><br/></p><ul list="u78437a12"><li data-lake-id="u234bb354" fid="ubac0338f" id="u234bb354"><span class="lake-fontsize-12" data-lake-id="uf6a746ca" id="uf6a746ca" style="color: rgb(44, 62, 80)">与工作内容相关的</span></li><li data-lake-id="u09d26550" fid="ubac0338f" id="u09d26550"><span class="lake-fontsize-12" data-lake-id="u5f86a62f" id="u5f86a62f" style="color: rgb(44, 62, 80)">与自己求职关注点相对应的</span></li><li data-lake-id="u4f42e56b" fid="ubac0338f" id="u4f42e56b"><span class="lake-fontsize-12" data-lake-id="u75fd5165" id="u75fd5165" style="color: rgb(44, 62, 80)">与自身定位相符合的</span></li></ul><p data-lake-id="u07c29aa3" id="u07c29aa3"><span class="lake-fontsize-12" data-lake-id="u78886aa6" id="u78886aa6" style="color: rgb(153, 153, 153)">这个问题看上去可有可无，其实很关键 ，面试官不喜欢说“没有问题”的人，没有问题就是自寻死路，没有问题传达出你对公司缺乏兴趣，而只是来寻找一笔薪水。其实在面试过程中谦虚礼貌的问面试官怎么称呼，该部门工作中的信息，如项目情况，开发技术再或者说贵公司的晋升机制是什么样的等。表现出一种很积极主动的状态是非常讨巧的。也可以更多的了解到自己来的工作环境。企业很欢迎这样的求职者，因为体现出你对学习的热情和对公司的忠诚度以及你的上进心。</span></p>
