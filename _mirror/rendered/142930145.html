<!DOCTYPE lake>
<p data-lake-id="u0e6c746f" id="u0e6c746f"><img alt="a1.png" class="yuque-image" loading="lazy" src="../_assets/89c26269875b784e6ec19dca.png"/></p><p data-lake-id="ud8feacaf" id="ud8feacaf"><span class="lake-fontsize-14" data-lake-id="u31cd73bc" id="u31cd73bc" style="color: rgba(0, 0, 0, 0.87)">机器狗由GD32控制板、舵机、腿部支撑结构组成</span></p><h2 collapsed="true" data-lake-id="MsHTB" id="MsHTB"><span data-lake-id="uce15d217" id="uce15d217" style="color: rgba(0, 0, 0, 0.87)">舵机</span></h2><h2 data-lake-id="a0tPd" id="a0tPd"><img alt="3.png" class="yuque-image" loading="lazy" src="../_assets/dc7099b2f6ec9be44b1b5a9a.png"/></h2><p data-lake-id="u49199b87" id="u49199b87"><span data-lake-id="u824acb5c" id="u824acb5c">舵机最早用于船舶上实现转向功能,由于可以通过程序连续控制其转角,因而被广泛应用于智能小车转向以及机器人各类关节中.</span></p><p data-lake-id="u9f2a1e21" id="u9f2a1e21"><img alt="4.png" class="yuque-image" loading="lazy" src="../_assets/97f6db143350dee08f427c8d.png"/></p><p data-lake-id="uebc7bb4e" id="uebc7bb4e"><span class="lake-fontsize-12" data-lake-id="uda5ae1b0" id="uda5ae1b0" style="color: rgb(51, 51, 51)">舵机由直流电机、减速齿轮组、传感器和控制电路组成的一套自动控制系统.通过发送信号,指定输出轴旋转角度.舵机一般而言都有最大旋转角度(比如180度)</span></p><p data-lake-id="u9e21d005" id="u9e21d005"><span class="lake-fontsize-12" data-lake-id="ua6f91000" id="ua6f91000" style="color: rgb(51, 51, 51)"> </span><span class="lake-fontsize-12" data-lake-id="ue9c1304c" id="ue9c1304c" style="color: rgb(51, 51, 51)">与普通直流电机的区别是:直流电机是一圈圈转动的,舵机智能在一定角度内转动,不能一圈圈转动.普通的直流电机无法反馈转动的角度信息,而舵机可以.</span></p><p data-lake-id="u349a79f4" id="u349a79f4"><span class="lake-fontsize-12" data-lake-id="u6671bd5c" id="u6671bd5c" style="color: rgb(51, 51, 51)">	用途也不相同,普通直流电机一般是整圈转动做动力用,舵机是控制某物体转动一定角度用(比如机器人的关节)</span></p><p data-lake-id="u20c34d07" id="u20c34d07"><img alt="5.jpg" class="yuque-image" loading="lazy" src="../_assets/5c5d465abb253113f71e0507.jpeg"/></p><p data-lake-id="u453c2879" id="u453c2879"><span data-lake-id="ufecfaa73" id="ufecfaa73">舵机的信号线</span></p><p data-lake-id="ud3fdb0d1" id="ud3fdb0d1"><img alt="6.png" class="yuque-image" loading="lazy" src="../_assets/c836bffaf5500bfe2c71b603.png"/></p><h2 data-lake-id="KigNK" id="KigNK"><span data-lake-id="ud3d71a3e" id="ud3d71a3e">腿型</span></h2><p data-lake-id="ubd57542d" id="ubd57542d"><img alt="2.png" class="yuque-image" loading="lazy" src="../_assets/c5122bd5c8db3bc43b329eab.png"/></p>
