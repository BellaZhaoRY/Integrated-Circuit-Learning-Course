<h2 data-lake-id="wohPl" id="wohPl"><span data-lake-id="uc4220b21" id="uc4220b21">配置断言输出</span></h2><p data-lake-id="u59e7fcce" id="u59e7fcce"><span data-lake-id="u9b5dd2fe" id="u9b5dd2fe">在</span><code data-lake-id="u48f17a24" id="u48f17a24"><span data-lake-id="u09c07676" id="u09c07676">FreeRTOSConfig.h</span></code><span data-lake-id="uf7078e66" id="uf7078e66">中注释掉原来的</span><code data-lake-id="ubd9c9073" id="ubd9c9073"><span data-lake-id="u8ef42bef" id="u8ef42bef">configASSERT</span></code><span data-lake-id="u5c52a6d1" id="u5c52a6d1">代码，并声明如下内容：</span></p><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="u2c8113c5" id="u2c8113c5"><span data-lake-id="ud9259faf" id="ud9259faf">则可以在串口中得到报错时的文件及所在行</span></p><p data-lake-id="u29f6256a" id="u29f6256a"><span data-lake-id="u7754b0bd" id="u7754b0bd">​</span><br/></p><h2 data-lake-id="MkmyC" id="MkmyC"><span data-lake-id="ua8b427ff" id="ua8b427ff">M3及以上内核阻塞式睡眠</span></h2><p data-lake-id="u148d2714" id="u148d2714"><strong><span data-lake-id="ufdeadf57" id="ufdeadf57">基于DWT的延时函数</span></strong></p><blockquote data-lake-id="ue35fd824" id="ue35fd824"><p data-lake-id="u4927e996" id="u4927e996"><span data-lake-id="u7335e75e" id="u7335e75e"> DWT（Data Watchpoint and Trace）是 ARM 内核中的一个调试组件，用于支持高级调试功能，如数据监视点、性能分析和事件跟踪。它并不是所有 ARM 内核都支持，而是出现在支持 </span><strong><span data-lake-id="u1c939865" id="u1c939865">Cortex-M3 及以上</span></strong><span data-lake-id="u32eda992" id="u32eda992">的内核中。  </span></p></blockquote><span class="yuque-card-unsupported">[codeblock]</span><span class="yuque-card-unsupported">[codeblock]</span>
