<h1 data-lake-id="cSZq2" id="cSZq2"><span data-lake-id="ude57b979" id="ude57b979">1&gt; 输入/输出型形参</span></h1><p data-lake-id="u57e9c8a2" id="u57e9c8a2"><span data-lake-id="u0fa9372c" id="u0fa9372c">功能需求：用一个函数实现2个数的和与差；</span></p><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="ue3e474fb" id="ue3e474fb"><img alt="image.png" class="yuque-image" loading="lazy" src="../../../_assets/14e045a3700676497ce79d37.png"/></p><hr/><h1 data-lake-id="sCfo2" id="sCfo2"><span data-lake-id="u7ede56bd" id="u7ede56bd">2&gt; return退出状态码</span></h1><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="u4032a161" id="u4032a161"><br/></p><p data-lake-id="uf63edc22" id="uf63edc22"><span data-lake-id="u0df2404c" id="u0df2404c">程序可以通过return返回一个整数值，通常称为“退出状态码”或“退出码”，用于指示程序在执行过程中是否成功或其他信息；</span></p><p data-lake-id="u9d36a413" id="u9d36a413"><span data-lake-id="u52393552" id="u52393552">通常，返回0表示执行成功，非0表示执行过程中出现了错误，不同的值可以定义不同的错误；</span></p><hr/><h1 data-lake-id="Mn0zf" id="Mn0zf"><span data-lake-id="u935c114a" id="u935c114a">3&gt; 指针-捞数据</span></h1><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="ufe72f5d3" id="ufe72f5d3"><img alt="image.png" class="yuque-image" loading="lazy" src="../../../_assets/11366ef40d4fa7e0b80115d3.png"/></p><p data-lake-id="u6ecfb777" id="u6ecfb777"><span data-lake-id="u04550818" id="u04550818">通过const修饰，一方面限制*src只读，不允许修改，另一方面告诉使用者这个参数是输入型参数，非常清晰；</span></p><hr/>
