<p data-lake-id="ua2b0755c" id="ua2b0755c"><br/></p><p data-lake-id="u85bee70d" id="u85bee70d"><span class="lake-fontsize-12" data-lake-id="u506ea683" id="u506ea683" style="color: rgb(44, 62, 80)">讲以前工作中的成就和挫折</span></p><p data-lake-id="u23dd3de4" id="u23dd3de4"><span class="lake-fontsize-12" data-lake-id="ud5fbe664" id="ud5fbe664" style="color: rgb(44, 62, 80)">举例子</span></p><p data-lake-id="u45f6bbaa" id="u45f6bbaa"><span class="lake-fontsize-12" data-lake-id="u75c86eb6" id="u75c86eb6" style="color: rgb(44, 62, 80)">成长与收获</span></p><p data-lake-id="u0687e820" id="u0687e820"><span class="lake-fontsize-12" data-lake-id="u6fe9040c" id="u6fe9040c" style="color: rgb(44, 62, 80)">开发：自己写了一套样例上线了</span></p><p data-lake-id="u08d4a3ac" id="u08d4a3ac"><span class="lake-fontsize-12" data-lake-id="u4ce9dea3" id="u4ce9dea3" style="color: rgb(44, 62, 80)">成长：提高效率, 客户满意, 取得了领导的信任</span></p><p data-lake-id="u64a1f4ef" id="u64a1f4ef"><span class="lake-fontsize-12" data-lake-id="uc9b13d9d" id="uc9b13d9d" style="color: rgb(44, 62, 80)">问题：</span></p><blockquote data-lake-id="ub88a7101" id="ub88a7101"><p data-lake-id="u30269431" id="u30269431"><span data-lake-id="uad45807f" id="uad45807f">时序问题：硬件开发中存在各种时序问题，例如时钟频率、传输速率、协议延迟等。时序问题会导致系统不稳定或性能下降。批量生产的时候时钟烧录不正确，导致返厂重烧。</span></p><p data-lake-id="u4e4ddfd9" id="u4e4ddfd9"><span data-lake-id="u3b37b336" id="u3b37b336">电源问题：开发中，电源是一个非常重要的问题。如果电源不稳定或者电源噪声过大，可能会导致系统的不稳定或性能下降。怎么去解决的这个问题。</span></p><p data-lake-id="u3be2184e" id="u3be2184e"><span data-lake-id="u485c2292" id="u485c2292">结构设计问题，生产研发排期问题，交期问题等。</span></p></blockquote><p data-lake-id="ud4c25725" id="ud4c25725"><span class="lake-fontsize-12" data-lake-id="ub6e13c31" id="ub6e13c31" style="color: rgb(44, 62, 80)">感悟：要考虑周期，多交流等等。</span></p>
