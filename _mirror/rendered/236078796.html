5" id="u52301de5"><span class="lake-fontsize-12" data-lake-id="u29137a39" id="u29137a39" style="color: rgb(60, 60, 67)">先按住REC按钮不放，接着按下RST复位按键并松开</span></p><p data-lake-id="ua88ccdd0" id="ua88ccdd0"><span class="lake-fontsize-12" data-lake-id="ua7c6bebe" id="ua7c6bebe" style="color: rgb(60, 60, 67)">当烧录软件中出现“发现一个LOADER设备”后松开REC按钮，下面就可以进行升级操作了。</span></p><p data-lake-id="udf8157d5" id="udf8157d5"><img alt="img-download_20240829_161640.png" class="yuque-image" loading="lazy" src="../../_assets/eb6ba2f8aac8102d92dea42f.png"/></p><h1 data-lake-id="q9ygc" data-lake-index-type="2" id="q9ygc"><span data-lake-id="u0ceac0c8" id="u0ceac0c8">烧录单独镜像</span></h1><ol list="u450a62d5"><li data-lake-id="uc005e3c5" fid="u87c7e5c4" id="uc005e3c5"><span data-lake-id="uac5e3301" id="uac5e3301">导入</span><code data-lake-id="ubd556c69" id="ubd556c69"><span data-lake-id="ubc27ea85" id="ubc27ea85">Tspi_Linux_config.cfg</span></code><span data-lake-id="u5feda54d" id="u5feda54d">配置文件</span></li><li data-lake-id="u5bd20fde" fid="u87c7e5c4" id="u5bd20fde"><span data-lake-id="ua306a524" id="ua306a524">填写分区镜像路径即可烧录</span></li></ol><p data-lake-id="u9fd0993e" id="u9fd0993e"><img alt="linux-compilation_20240829_011449.png" class="yuque-image" loading="lazy" src="../../_assets/c41c7c6c3db044dd28b34457.png"/></p><blockquote data-lake-id="u83b6e1dd" id="u83b6e1dd"><p data-lake-id="u28cef349" id="u28cef349"><span data-lake-id="u21952ef2" id="u21952ef2">可以通过</span><code data-lake-id="u03e12527" id="u03e12527"><span data-lake-id="u5c5047fa" id="u5c5047fa">cat /etc/issue</span></code><span data-lake-id="u062c74df" id="u062c74df">查看系统欢迎信息</span></p></blockquote>
