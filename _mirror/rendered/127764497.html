<!DOCTYPE lake>
<h1 data-lake-id="P91mR" id="P91mR"><span data-lake-id="u6051bba5" id="u6051bba5">局部变量</span></h1><ul list="ua0fb3a1d"><li data-lake-id="ua4a6d8da" fid="ua34cbf1a" id="ua4a6d8da"><span data-lake-id="u6ffaea17" id="u6ffaea17">定义在代码块</span><code data-lake-id="ua89cd438" id="ua89cd438"><span data-lake-id="u3dd7deed" id="u3dd7deed">{}</span></code><span data-lake-id="ude94a58e" id="ude94a58e">里面的变量称为局部变量（Local Variable）</span></li><li data-lake-id="u4943c1e3" fid="ua34cbf1a" id="u4943c1e3"><span data-lake-id="ua3cf8316" id="ua3cf8316">局部变量的作用域(作用范围)仅限于代码块</span><code data-lake-id="ub647e34a" id="ub647e34a"><span data-lake-id="u42794b14" id="u42794b14">{}</span></code></li></ul><ul data-lake-indent="1" list="ua0fb3a1d"><li data-lake-id="u495fcc64" fid="ua34cbf1a" id="u495fcc64"><span data-lake-id="u6a300f48" id="u6a300f48">离开该代码块</span><code data-lake-id="u9f1576c4" id="u9f1576c4"><span data-lake-id="uc2847e03" id="uc2847e03">{}</span></code><span data-lake-id="u097c280f" id="u097c280f">是无效的</span></li><li data-lake-id="u5b545be8" fid="ua34cbf1a" id="u5b545be8"><span data-lake-id="ubdfed4b7" id="ubdfed4b7">离开代码块</span><code data-lake-id="u1509ea33" id="u1509ea33"><span data-lake-id="u4f9a6c44" id="u4f9a6c44">{}</span></code><span data-lake-id="u05732d23" id="u05732d23">后，局部变量自动释放</span></li></ul><ul list="ua0fb3a1d" start="3"><li data-lake-id="uafad478d" fid="ua34cbf1a" id="uafad478d"><span data-lake-id="u1f630d10" id="u1f630d10">示例代码：</span></li></ul><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="u9dabf614" id="u9dabf614"><br/></p><h1 data-lake-id="v0SXI" id="v0SXI"><span data-lake-id="u6a97a521" id="u6a97a521">全局变量</span></h1><ul list="u08b96cea"><li data-lake-id="ubd2cd9c3" fid="u6da7db38" id="ubd2cd9c3"><span data-lake-id="uc02c7f5a" id="uc02c7f5a">在所有函数外部定义的变量称为全局变量（Global Variable），它的作用域默认是整个程序，也就是所有的源文件</span></li><li data-lake-id="u40499145" fid="u6da7db38" id="u40499145"><span data-lake-id="ucbc4d932" id="ucbc4d932">示例代码：</span></li></ul><span class="yuque-card-unsupported">[codeblock]</span>
