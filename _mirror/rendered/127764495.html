<ul list="u5a7b8e74"><li data-lake-id="uff230af9" fid="u9002cfd8" id="uff230af9"><span data-lake-id="u946db36e" id="u946db36e">函数是一种可重用的代码块，用于执行特定任务或完成特定功能</span></li><li data-lake-id="u39ec0ffb" fid="u9002cfd8" id="u39ec0ffb"><span data-lake-id="u4c40944c" id="u4c40944c">函数作用：对具备相同逻辑的代码进行封装，提高代码的编写效率，实现对代码的重用</span></li><li data-lake-id="uc003802a" fid="u9002cfd8" id="uc003802a"><span data-lake-id="u9b8772cb" id="u9b8772cb">函数作用演示代码：</span></li></ul><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="uf7df9df9" id="uf7df9df9"><br/></p><ul list="uadb156cf"><li data-lake-id="u7d1f7215" fid="ud67d2888" id="u7d1f7215"><span data-lake-id="ubd7b5d95" id="ubd7b5d95">函数使用步骤</span></li></ul><ul data-lake-indent="1" list="uadb156cf"><li data-lake-id="u1a036f10" fid="ud67d2888" id="u1a036f10"><span data-lake-id="u40e2b25f" id="u40e2b25f">定义函数</span></li></ul><ul data-lake-indent="2" list="uadb156cf"><li data-lake-id="uba68a127" fid="ud67d2888" id="uba68a127"><span data-lake-id="uc159304d" id="uc159304d">理解为制作工具，工具只需要制作1次即可</span></li></ul><ul data-lake-indent="1" list="uadb156cf" start="2"><li data-lake-id="u9aae2009" fid="ud67d2888" id="u9aae2009"><span data-lake-id="u98f28326" id="u98f28326">调用函数</span></li></ul><ul data-lake-indent="2" list="uadb156cf"><li data-lake-id="u5db08b17" fid="ud67d2888" id="u5db08b17"><span data-lake-id="ubf464576" id="ubf464576">理解为使用工具</span></li></ul><ul list="uadb156cf" start="2"><li data-lake-id="u1c4c5189" fid="ud67d2888" id="u1c4c5189"><span data-lake-id="uea16b59f" id="uea16b59f">函数分类</span></li></ul><ul data-lake-indent="1" list="uadb156cf"><li data-lake-id="ub3d968ab" fid="ud67d2888" id="ub3d968ab"><span data-lake-id="u4cedafeb" id="u4cedafeb">系统函数，即库函数：这是由编译系统提供的，用户不必自己定义这些函数，可以直接使用它们，如我们常用的打印函数printf()。</span></li><li data-lake-id="u91efac95" fid="ud67d2888" id="u91efac95"><span data-lake-id="u0f34cdec" id="u0f34cdec">自定义函数：用以解决用户的专门需要。</span></li></ul>
