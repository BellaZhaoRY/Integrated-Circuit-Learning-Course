<h1 data-lake-id="WItqC" id="WItqC"><span data-lake-id="ufa136f4b" id="ufa136f4b">概念</span></h1><ul list="u3192811c"><li data-lake-id="u9ebad385" fid="uf541f870" id="u9ebad385"><span data-lake-id="ub8feacb6" id="ub8feacb6">枚举：将变量的值一一列举出来，变量的值只限于列举出来的值的范围内</span></li><li data-lake-id="u3aad3c63" fid="uf541f870" id="u3aad3c63"><span data-lake-id="u0ce977f1" id="u0ce977f1">语法格式：</span></li></ul><span class="yuque-card-unsupported">[codeblock]</span><ul data-lake-indent="1" list="u9b75f60e"><li data-lake-id="ua64acd21" fid="u4f8444b0" id="ua64acd21"><span data-lake-id="u3fa6e0bf" id="u3fa6e0bf">在枚举值表中应列出所有可用值，也称为枚举元素</span></li><li data-lake-id="u989bba11" fid="u4f8444b0" id="u989bba11"><span data-lake-id="u8e846a30" id="u8e846a30">枚举值是常量，不能在程序中用赋值语句再对它赋值</span></li><li data-lake-id="u54a8c60a" fid="u4f8444b0" id="u54a8c60a"><span data-lake-id="u47d5fc0d" id="u47d5fc0d">枚举元素本身由系统定义了一个表示序号的数值从0开始顺序定义为0，1，2 …</span></li></ul><h1 data-lake-id="yXgT4" id="yXgT4"><span data-lake-id="u484c0f8d" id="u484c0f8d">示例</span></h1><span class="yuque-card-unsupported">[codeblock]</span>
