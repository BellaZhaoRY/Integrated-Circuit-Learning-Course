<!DOCTYPE lake>
<p data-lake-id="u8d77b969" id="u8d77b969"><img alt="image.png" class="yuque-image" loading="lazy" src="../../../_assets/48f1c5406cf1fa620d962d19.png"/><span class="lake-fontsize-11" data-lake-id="ud49befd4" id="ud49befd4" style="color: rgb(51, 51, 51)"><br/></span><span data-lake-id="u46f8337c" id="u46f8337c">方法：把连续取N个采样值看成一个队列，队列的长度固定为N。每次采样到一个新数据放入队尾，并扔掉原来队首的一次数据(先进先出原则)。把队列中的N个数据进行算术平均运算,就可获得新的滤波结果。</span></p><p data-lake-id="u47463e8c" id="u47463e8c"><span data-lake-id="u333d7d8f" id="u333d7d8f">N值的选取：流量，N=12；压力：N=4；液面，N=4~12；温度，N=1~4</span></p><p data-lake-id="uccc0c8f6" id="uccc0c8f6"><span data-lake-id="ucd0b2920" id="ucd0b2920">优点：对周期性干扰有良好的抑制作用，平滑度高；试用于高频振荡的系统</span></p><p data-lake-id="u17e2ae95" id="u17e2ae95"><span data-lake-id="u5aa997f3" id="u5aa997f3">缺点：灵敏度低；对偶然出现的脉冲性干扰的抑制作用较差，不适于脉冲干扰较严重的场合比较浪费RAM（改进方法，减去的不是队首的值，而是上一次得到的平均值）</span></p><p data-lake-id="u46a3192c" id="u46a3192c"><span data-lake-id="u2a71e009" id="u2a71e009">​</span><br/></p><span class="yuque-card-unsupported">[codeblock]</span>
