<p data-lake-id="ub4793932" id="ub4793932"><span data-lake-id="u5ebb3dbc" id="u5ebb3dbc">将</span><strong><span data-lake-id="uc9bdad43" id="uc9bdad43">属性</span></strong><span data-lake-id="u617fe0bd" id="u617fe0bd">或者</span><strong><span data-lake-id="u8095f610" id="u8095f610">方法</span></strong><span data-lake-id="u66832802" id="u66832802">设置为不能在外部访问，就是私有化</span></p><p data-lake-id="ua5db13ee" id="ua5db13ee"><span data-lake-id="u052c8677" id="u052c8677">私有化包括：</span><strong><span data-lake-id="u6a8920cf" id="u6a8920cf">属性私有化</span></strong><span data-lake-id="u6f2c4d48" id="u6f2c4d48">、</span><strong><span data-lake-id="ue37b7047" id="ue37b7047">方法私有化</span></strong></p><h2 data-lake-id="T4GYA" data-lake-index-type="2" id="T4GYA"><span data-lake-id="u7f23c239" id="u7f23c239">属性私有化</span></h2><p data-lake-id="ua8cf1066" id="ua8cf1066"><span data-lake-id="u49dd35dd" id="u49dd35dd">属性私有化格式，注意是两个下划线</span><code data-lake-id="u81fc5833" id="u81fc5833"><span data-lake-id="ucee05b2c" id="ucee05b2c">__</span></code><span data-lake-id="u07f8c7f3" id="u07f8c7f3"><br/></span><code data-lake-id="u0bf20107" id="u0bf20107"><span data-lake-id="u863b8095" id="u863b8095">self.__属性名 = 属性值</span></code></p><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="u2016e194" id="u2016e194"><span data-lake-id="ud8088d3a" id="ud8088d3a">私有化作用：保证类中数据安全</span></p><h2 data-lake-id="uzr9h" data-lake-index-type="2" id="uzr9h"><span data-lake-id="uc80db770" id="uc80db770">方法私有化</span></h2><p data-lake-id="u77eef989" id="u77eef989"><span data-lake-id="u88798169" id="u88798169">方法的私有化方式和属性私有化方式一样</span></p><span class="yuque-card-unsupported">[codeblock]</span>
