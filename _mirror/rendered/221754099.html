<h1 data-lake-id="RIYVW" id="RIYVW"><span data-lake-id="u9284404b" id="u9284404b">0&gt; 程序员如何优雅地"偷懒"</span></h1><p data-lake-id="u5a6c2415" id="u5a6c2415"><img alt="image.png" class="yuque-image" loading="lazy" src="../../_assets/fca6caf7a92070864b41cbd3.png"/></p><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="u5b188306" id="u5b188306"><span data-lake-id="u54993a7a" id="u54993a7a">致敬Dennis Ritchie的智慧, ++更能明确递增！</span></p><hr/><h1 data-lake-id="RuUkH" id="RuUkH"><span data-lake-id="u78b14c96" id="u78b14c96">1&gt; a++和++a 独立使用时相同</span></h1><p data-lake-id="u12542517" id="u12542517"><span data-lake-id="u5741caa3" id="u5741caa3">等价于：a = a + 1;</span></p><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="u4798b4fc" id="u4798b4fc"><span data-lake-id="u4a68c87f" id="u4a68c87f">✅</span><span class="lake-fontsize-14" data-lake-id="ufb277335" id="ufb277335" style="color: #DF2A3F"> </span><span class="lake-fontsize-14" data-lake-id="u002e82b6" id="u002e82b6" style="color: #000000">独立使用时：</span><span class="lake-fontsize-14" data-lake-id="ub12bef59" id="ub12bef59" style="color: #DF2A3F">a++;  等同于 a = a + 1;  等同于 ++a;  等同于 a+=1；</span></p><hr/><h1 data-lake-id="YUZlv" id="YUZlv"><span data-lake-id="ufa1cb7d4" id="ufa1cb7d4">2&gt; a++和++a 应用于表达式时不同</span></h1><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="ud750730a" id="ud750730a"><strong><span class="lake-fontsize-14" data-lake-id="u3d58a0bf" id="u3d58a0bf" style="color: #DF2A3F">后++，先赋值，后运算；</span></strong></p><p data-lake-id="u982c8ae5" id="u982c8ae5"><span data-lake-id="ud2fc9989" id="ud2fc9989">​</span><br/></p><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="u025081f4" id="u025081f4"><strong><span class="lake-fontsize-14" data-lake-id="u02475481" id="u02475481" style="color: #5C8D07">前++，先运算，后赋值；</span></strong></p><hr/><h1 data-lake-id="sbCKz" id="sbCKz"><span data-lake-id="u259ce054" id="u259ce054">🐻</span><span data-lake-id="u01c128dd" id="u01c128dd">实践练习：</span></h1><p data-lake-id="ub13a8483" id="ub13a8483"><span data-lake-id="ubd96bb25" id="ubd96bb25">编写程序，验证 -- 运算符的前缀和后缀形式</span></p><span class="yuque-card-unsupported">[codeblock]</span>
