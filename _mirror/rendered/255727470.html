<h2 data-lake-id="U62dp" id="U62dp"><span data-lake-id="u697051d1" id="u697051d1">配置选项</span></h2><h3 data-lake-id="jEm1x" id="jEm1x"><span data-lake-id="ubd5650d7" id="ubd5650d7">配置主题及编码</span></h3><p data-lake-id="u4d181680" id="u4d181680"><img alt="PixPin_2026-02-03_15-46-05.png" class="yuque-image" loading="lazy" src="../../../_assets/fb1b97a0bf51e92a93c84be0.png"/></p><p data-lake-id="ueb845bb7" id="ueb845bb7"><img alt="PixPin_2026-02-03_15-46-27.png" class="yuque-image" loading="lazy" src="../../../_assets/3c461cbb578b54c8df57486d.png"/></p><p data-lake-id="u157d00ce" id="u157d00ce"><span data-lake-id="u0b5302b4" id="u0b5302b4">如果默认选项是UTF-8编码会导致下位机发来的中文无法显示，改成GB2312才能正确显示中文</span></p><p data-lake-id="u4dfabd48" id="u4dfabd48"><img alt="PixPin_2026-02-03_15-47-41.png" class="yuque-image" loading="lazy" src="../../../_assets/d23c95eb3048086cdece513b.png"/></p><p data-lake-id="ub7782831" id="ub7782831"><span data-lake-id="ua1327b6d" id="ua1327b6d">对所有会话生效</span></p><h3 data-lake-id="cifRA" id="cifRA"><span data-lake-id="u6309d5f2" id="u6309d5f2">配置右键选项</span></h3><p data-lake-id="ufe01ec2d" id="ufe01ec2d"><span data-lake-id="u51c3e2bb" id="u51c3e2bb">第一次在对话框点击右键，会弹出提示如下：</span></p><p data-lake-id="u05b6594f" id="u05b6594f"><img alt="884e9394e8062eaa48bdd9e4a68d3bfa.jpg" class="yuque-image" loading="lazy" src="../../../_assets/73b209ea392d8952d8163d08.jpeg"/></p><p data-lake-id="u00c5a196" id="u00c5a196"><span data-lake-id="u76cde06f" id="u76cde06f">我们最好选择下边的 </span><code data-lake-id="u72fd0e92" id="u72fd0e92"><strong><span data-lake-id="u18ee90a9" id="u18ee90a9">Display the Context Menu</span></strong></code><span data-lake-id="u4b01e482" id="u4b01e482"> 显示上下文菜单，这样右键可以有更多功能</span></p><p data-lake-id="u7ed8f150" id="u7ed8f150"><img alt="PixPin_2026-02-03_15-44-54.png" class="yuque-image" loading="lazy" src="../../../_assets/459ebcde816700d201d2bec8.png"/></p><p data-lake-id="ubc38462b" id="ubc38462b"><span data-lake-id="u0a186b3f" id="u0a186b3f">如果已经选了第一个，可以进入菜单，修改此配置</span></p><p data-lake-id="ue34e9505" id="ue34e9505"><img alt="PixPin_2026-02-03_15-50-38.png" class="yuque-image" loading="lazy" src="../../../_assets/9bfa5ef1f866af4c59fe9aa4.png"/></p><p data-lake-id="u138ca815" id="u138ca815"><img alt="PixPin_2026-02-03_15-50-11.png" class="yuque-image" loading="lazy" src="../../../_assets/884b72717c65cd29243b6acf.png"/></p>
