<!DOCTYPE lake>
<h2 data-lake-id="CwGXJ" data-lake-index-type="2" id="CwGXJ"><span data-lake-id="uf665a62a" id="uf665a62a">递归简介</span></h2><p data-lake-id="u22a2f35e" id="u22a2f35e"><span data-lake-id="u8ce06082" id="u8ce06082">递归指的是把一个大型复杂的问题层层转化为一个与原问题相似的规模较小的问题来求解</span></p><p data-lake-id="u8385bf90" id="u8385bf90"><span data-lake-id="ud62d6eb0" id="ud62d6eb0">如果 一个函数在</span><strong><span data-lake-id="u30d61b66" id="u30d61b66">内部调用其本身</span></strong><span data-lake-id="ue25ad442" id="ue25ad442">，这个函数就是 </span><strong><span data-lake-id="u818038c3" id="u818038c3">递归函数</span></strong></p><p data-lake-id="uc85dc276" id="uc85dc276"><span data-lake-id="ua1bf29e6" id="ua1bf29e6">递归的好处是：只需少量的程序就可描述出解题过程所需要的多次重复计算</span></p><p data-lake-id="uc06da56c" id="uc06da56c"><span data-lake-id="ua405c566" id="ua405c566">我们先来看看生活中递归的场景:</span></p><span class="yuque-card-unsupported">[codeblock]</span><h2 data-lake-id="QCexF" data-lake-index-type="2" id="QCexF"><span data-lake-id="u9f9019da" id="u9f9019da">递归求阶乘</span></h2><p data-lake-id="u3a635ecc" id="u3a635ecc"><span data-lake-id="u13c9320c" id="u13c9320c">递归最经典的案例是求n的阶乘</span></p><p data-lake-id="udefbd21a" id="udefbd21a"><span data-lake-id="u9bb4bd82" id="u9bb4bd82">5的阶乘：</span><code data-lake-id="u1bc1fa52" id="u1bc1fa52"><span data-lake-id="ue2ad95db" id="ue2ad95db">5*4*3*2*1</span></code></p><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="uf83fe9ae" id="uf83fe9ae"><span data-lake-id="u5f8e295f" id="u5f8e295f">分析:</span></p><p data-lake-id="ud1eefc17" id="ud1eefc17"><span data-lake-id="u708d17ed" id="u708d17ed">如果传递的是1，则1的阶乘为1</span></p><p data-lake-id="udbd3489a" id="udbd3489a"><span data-lake-id="u1260e600" id="u1260e600">如果传递的是大于1的数，n的阶乘就等于n乘以n-1的阶乘</span></p><p data-lake-id="u3283e21b" id="u3283e21b"><span data-lake-id="uf7a1f8f5" id="uf7a1f8f5">​</span><br/></p><h2 data-lake-id="okwzc" data-lake-index-type="2" id="okwzc"><span data-lake-id="ua3ce2ec5" id="ua3ce2ec5">练习：</span></h2><ul list="ud5e2a296"><li data-lake-id="u50745c64" fid="ube0d4c07" id="u50745c64"><span data-lake-id="ubba22c0b" id="ubba22c0b">搜索资料，通过递归实现斐波那契数列</span></li></ul>
