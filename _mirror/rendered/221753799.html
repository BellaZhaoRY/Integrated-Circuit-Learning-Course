<h1 data-lake-id="Z1wos" id="Z1wos"><span data-lake-id="u45e10b92" id="u45e10b92">1&gt; 验证比较运算符</span></h1><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="ub4deccc1" id="ub4deccc1"><span class="lake-fontsize-14" data-lake-id="u13497484" id="u13497484">数值作比较，成立为1（true）， 不成立为0（false）;</span></p><p data-lake-id="u1a383587" id="u1a383587"><span class="lake-fontsize-14" data-lake-id="uffb397ba" id="uffb397ba">应用：if判读语句，for/while循环控制语句；</span></p><hr/><h1 data-lake-id="y9BKn" id="y9BKn"><span data-lake-id="u1307670c" id="u1307670c">2&gt; 混淆 == 和 =</span></h1><span class="yuque-card-unsupported">[codeblock]</span><hr/><h1 data-lake-id="V3Uxl" id="V3Uxl"><span data-lake-id="ub0d567c3" id="ub0d567c3">3&gt;  浮点数比较</span></h1><span class="yuque-card-unsupported">[codeblock]</span><p data-lake-id="u6d7cca05" id="u6d7cca05"><span data-lake-id="ub5fae213" id="ub5fae213">⚡⚡</span><span data-lake-id="uff12fe19" id="uff12fe19">浮点数在计算机中以二进制近似存储，存在精度问题，直接使用==比较往往会出错</span><span data-lake-id="u2f098105" id="u2f098105">❌</span><span data-lake-id="u128d8cfd" id="u128d8cfd">。</span></p><p data-lake-id="u52fa7f62" id="u52fa7f62"><span data-lake-id="u7d173a19" id="u7d173a19">例如：0.1 + 0.2 != 0.3（实际结果约为0.30000001192092895508）</span></p><p data-lake-id="u1f075feb" id="u1f075feb"><br/></p><hr/><h1 data-lake-id="sbCKz" id="sbCKz"><span data-lake-id="u259ce054" id="u259ce054">🐻</span><span data-lake-id="u56f8ce18" id="u56f8ce18">实践练习：</span></h1><p data-lake-id="ufd368fa1" id="ufd368fa1"><span class="lake-fontsize-14" data-lake-id="u625971bd" id="u625971bd">字符比较验证</span></p><span class="yuque-card-unsupported">[codeblock]</span>
