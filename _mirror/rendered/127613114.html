<p data-lake-id="u99f4fc70" id="u99f4fc70"><span data-lake-id="u26ae5a1f" id="u26ae5a1f">​</span><br/></p><p data-lake-id="u2ecfa254" id="u2ecfa254"><span data-lake-id="ua6578443" id="ua6578443">建议焊接时，按照元器件高度，从低到高的顺序焊接。焊接后实物如下：</span></p><p data-lake-id="u41790a94" id="u41790a94"><img alt="image.png" class="yuque-image" loading="lazy" src="../_assets/8385fdc16ed32ad84ac2df45.png"/></p><p data-lake-id="u48266da1" id="u48266da1"><img alt="stc8h扩展板实物图.jpg" class="yuque-image" loading="lazy" src="../_assets/945d1e302abdad3f2afeeba0.jpeg"/></p><p data-lake-id="u5950b5b0" id="u5950b5b0"><br/></p><p data-lake-id="ue32c78a6" id="ue32c78a6"><span data-lake-id="uc3e00968" id="uc3e00968">​</span><br/></p><p data-lake-id="uf62baacc" id="uf62baacc"><span data-lake-id="ude3a19f0" id="ude3a19f0">电阻在开发板上丝印标注的有大小</span></p><table class="lake-table" data-lake-id="DE4Hh" id="DE4Hh" margin="true" style="width: 173px" width-mode="contain"><colgroup><col width="102"/><col width="71"/></colgroup><tbody><tr data-lake-id="uf645fcbb" id="uf645fcbb"><td data-lake-id="ue63a9a89" id="ue63a9a89"><p data-lake-id="uce8b1bad" id="uce8b1bad"><span data-lake-id="u6d36b96f" id="u6d36b96f">1K电阻</span></p></td><td data-lake-id="ub340212f" id="ub340212f"><p data-lake-id="u8bc5cef0" id="u8bc5cef0"><span data-lake-id="u552c1847" id="u552c1847">2个</span></p></td></tr><tr data-lake-id="u914acaa6" id="u914acaa6"><td data-lake-id="u0b960d3c" id="u0b960d3c"><p data-lake-id="ub51cc4fb" id="ub51cc4fb"><span data-lake-id="u2f502293" id="u2f502293">10K电阻</span></p></td><td data-lake-id="u780eaaf9" id="u780eaaf9"><p data-lake-id="u6d662cc8" id="u6d662cc8"><span data-lake-id="uf5fee0b3" id="uf5fee0b3">6个</span></p></td></tr><tr data-lake-id="u45e771c0" id="u45e771c0"><td data-lake-id="ubfabcfc7" id="ubfabcfc7"><p data-lake-id="ub3be51c9" id="ub3be51c9"><span data-lake-id="u23ed547e" id="u23ed547e">4.7K电阻</span></p></td><td data-lake-id="u25937d8d" id="u25937d8d"><p data-lake-id="ud1690966" id="ud1690966"><span data-lake-id="ua5d1bca9" id="ua5d1bca9">1个</span></p></td></tr><tr data-lake-id="ud424a1ce" id="ud424a1ce"><td data-lake-id="u83a4917f" id="u83a4917f"><p data-lake-id="u39386a29" id="u39386a29"><span data-lake-id="uf778b6c7" id="uf778b6c7">220欧电阻</span></p></td><td data-lake-id="ua2d0913f" id="ua2d0913f"><p data-lake-id="u0396f529" id="u0396f529"><span data-lake-id="uf8bb2bf6" id="uf8bb2bf6">4个</span></p></td></tr></tbody></table><p data-lake-id="u2c17a601" id="u2c17a601"><span data-lake-id="u33439908" id="u33439908">注意勿焊反的元器件：二极管，时钟芯片，74HC595芯片。</span></p><p data-lake-id="u384372cb" id="u384372cb"><span data-lake-id="u8d505046" id="u8d505046">建议将核心板插在排母上之后，再焊接排母，避免排母焊弯，导致核心板不好插。</span></p><p data-lake-id="u120f5809" id="u120f5809"><span data-lake-id="u053c4263" id="u053c4263">​</span><br/></p><a class="yuque-card-link" href="https://cdn.nlark.com/yuque/0/2023/jpeg/27903758/1699005292696-c2cdfede-824c-4d47-bf73-a37f54723014.jpeg" rel="noopener noreferrer" target="_blank">board：board</a><p data-lake-id="uf09d5210" id="uf09d5210"><br/></p>
