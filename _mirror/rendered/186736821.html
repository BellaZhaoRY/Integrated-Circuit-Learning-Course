<p data-lake-id="u99074e8c" id="u99074e8c"><span data-lake-id="uc7e35361" id="uc7e35361">我们前面用过命令操作过GPIO,</span><span class="lake-fontsize-12" data-lake-id="ubdfacbeb" id="ubdfacbeb" style="color: rgb(64, 64, 64); background-color: rgb(252, 252, 252)">命令执行的原理非常简单：</span></p><ul list="u8f5e7371"><li data-lake-id="uc64d15e9" fid="ud8357fcd" id="uc64d15e9"><span class="lake-fontsize-12" data-lake-id="u70b88c37" id="u70b88c37" style="color: rgb(64, 64, 64); background-color: rgb(252, 252, 252)">把GPIO的编号写入到export文件，导出GPIO设备。</span></li><li data-lake-id="u9aa16ff5" fid="ud8357fcd" id="u9aa16ff5"><span class="lake-fontsize-12" data-lake-id="ue754099e" id="ue754099e" style="color: rgb(64, 64, 64); background-color: rgb(252, 252, 252)">修改GPIO设备属性direction文件值为out，把GPIO设置为输出方向。</span></li><li data-lake-id="u4457da8c" fid="ud8357fcd" id="u4457da8c"><span class="lake-fontsize-12" data-lake-id="u718872b4" id="u718872b4" style="color: rgb(64, 64, 64); background-color: rgb(252, 252, 252)">修改GPIO设备属性文件value的值为1或0，控制GPIO高电平或低电平。</span></li><li data-lake-id="u9dcb9db6" fid="ud8357fcd" id="u9dcb9db6"><span class="lake-fontsize-12" data-lake-id="uca8b1b85" id="uca8b1b85" style="color: rgb(64, 64, 64); background-color: rgb(252, 252, 252)">把GPIO的编号写入到unexport文件，关闭GPIO设备。</span></li></ul><p data-lake-id="uca0b57cd" id="uca0b57cd"><span class="lake-fontsize-12" data-lake-id="u9716d3a9" id="u9716d3a9" style="color: rgb(64, 64, 64); background-color: rgb(252, 252, 252)">这个过程可以使用系统调用来实现</span><code data-lake-id="u38068d12" id="u38068d12"><span class="lake-fontsize-12" data-lake-id="ud3e9460f" id="ud3e9460f" style="color: rgb(64, 64, 64); background-color: rgb(252, 252, 252)">/sys/class/gpio/export</span></code></p><h3 data-lake-id="e3bd8" id="e3bd8"><span data-lake-id="ufcf32be6" id="ufcf32be6" style="color: rgb(64, 64, 64); background-color: rgb(252, 252, 252)">GPIO输出</span></h3><span class="yuque-card-unsupported">[codeblock]</span><h3 data-lake-id="qiKtf" id="qiKtf"><span data-lake-id="u795b97f4" id="u795b97f4">GPIO输入</span></h3><span class="yuque-card-unsupported">[codeblock]</span>
