<!DOCTYPE lake>
<h1 data-lake-id="ddScc" id="ddScc"><span data-lake-id="ud5e229ae" id="ud5e229ae">1&gt; 功能需求</span></h1><p data-lake-id="ue3778c0f" id="ue3778c0f"><span data-lake-id="ua606167f" id="ua606167f">实现一个计算器程序，能够完成+，-，*，/等；</span></p><hr/><h1 data-lake-id="z48Es" id="z48Es"><span data-lake-id="udb508fe7" id="udb508fe7">2&gt; 程序设计</span></h1><span class="yuque-card-unsupported">[codeblock]</span><hr/><h1 data-lake-id="pRNVT" id="pRNVT"><span data-lake-id="u509f1a7d" id="u509f1a7d">3&gt; 存在问题</span></h1><p data-lake-id="u1655fafe" id="u1655fafe"><span data-lake-id="u5d485746" id="u5d485746">🐼</span><span data-lake-id="u739ed9a7" id="u739ed9a7">代码维护性差：</span></p><p data-lake-id="uf83d2bde" id="uf83d2bde" style="text-indent: 2em"><span data-lake-id="ue350c013" id="ue350c013">所有函数堆叠在一个文件中，超过300行后维护困难；</span></p><p data-lake-id="u6eb3c23f" id="u6eb3c23f"><span data-lake-id="u4cbc7889" id="u4cbc7889">🐪</span><span data-lake-id="u5f2565db" id="u5f2565db">无法模块化复用：</span></p><p data-lake-id="u86cb06b2" id="u86cb06b2" style="text-indent: 2em"><span data-lake-id="u2b02ee69" id="u2b02ee69">想在新项目中复用计算功能， 又必须打开文件，拷贝计算相关的函数；</span></p><p data-lake-id="u33432730" id="u33432730"><span data-lake-id="u9e8b5c59" id="u9e8b5c59">❓</span><span data-lake-id="u33750249" id="u33750249">想象下，把语文，数学，英语，放到一篇文章里，是件恐怖的事，所以必须分不同书，不同的章节；</span></p><p data-lake-id="ub65374be" id="ub65374be"><span data-lake-id="ud8e76ec1" id="ud8e76ec1">​</span><br/></p><p data-lake-id="udce3ee74" id="udce3ee74"><span data-lake-id="u7e59b6f2" id="u7e59b6f2">查看 51/32的工程，感受分文件编程的重要性；</span></p>
