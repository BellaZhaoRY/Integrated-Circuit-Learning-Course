<p data-lake-id="u4b589f74" id="u4b589f74"><span data-lake-id="u51249e77" id="u51249e77">知之为知之，不知为不知，不知道的就说忘记了，不记得了。不要瞎编乱造。</span></p><p data-lake-id="u83876c4b" id="u83876c4b"><span data-lake-id="u37208f9d" id="u37208f9d">搞技术的你一瞎编就露馅了。</span></p><ul list="u151d7ebe"><li data-lake-id="ueed7d8bd" fid="ufa5d4e69" id="ueed7d8bd"><span class="lake-fontsize-12" data-lake-id="uc4514255" id="uc4514255" style="color: rgb(44, 62, 80)">各项能力都要有实例的支撑</span></li><li data-lake-id="u1522938c" fid="ufa5d4e69" id="u1522938c"><span class="lake-fontsize-12" data-lake-id="ucee452e9" id="ucee452e9" style="color: rgb(44, 62, 80)">求职前对公司、岗位职责及要求要进行了解</span></li><li data-lake-id="u30bd06d8" fid="ufa5d4e69" id="u30bd06d8"><span class="lake-fontsize-12" data-lake-id="ua25304b0" id="ua25304b0" style="color: rgb(44, 62, 80)">面试过后要认真总结和分享（重要）</span></li><li data-lake-id="udb5e74fe" fid="ufa5d4e69" id="udb5e74fe"><span class="lake-fontsize-12" data-lake-id="u124d062c" id="u124d062c" style="color: rgb(44, 62, 80)">薪资的要求要在合理的范围（不能过高及过低）</span></li></ul>
