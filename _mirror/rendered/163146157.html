<!DOCTYPE lake>
<p data-lake-id="uecf44f69" id="uecf44f69"><img alt="image.png" class="yuque-image" loading="lazy" src="../../../_assets/ab004feca1a1283beab71a12.png"/></p><p data-lake-id="udd58ac99" id="udd58ac99"><span class="lake-fontsize-11" data-lake-id="uaa00ee89" id="uaa00ee89" style="color: rgb(51, 51, 51)"><br/></span><span data-lake-id="u6f28462a" id="u6f28462a">方法：连续取N个采样值进行算术平均运算;</span></p><p data-lake-id="uac227ea5" id="uac227ea5"><span data-lake-id="u3ef258d3" id="u3ef258d3">N值较大时：信号平滑度较高，但灵敏度较低</span></p><p data-lake-id="uc82e063e" id="uc82e063e"><span data-lake-id="ubb8fa929" id="ubb8fa929">N值较小时：信号平滑度较低，但灵敏度较高</span></p><p data-lake-id="u4bf9b8ed" id="u4bf9b8ed"><span data-lake-id="u8e72839b" id="u8e72839b">优点：试用于对一般具有随机干扰的信号进行滤波。这种信号的特点是有一个平均值，信号在某一数值范围附近上下波动。</span></p><p data-lake-id="u3cc8967a" id="u3cc8967a"><span data-lake-id="u1f4b6c46" id="u1f4b6c46">缺点：测量速度较慢或要求数据计算较快的实时控制不适用。</span></p><p data-lake-id="uc6bfb94e" id="uc6bfb94e"><span data-lake-id="u3a6ad0dd" id="u3a6ad0dd">​</span><br/></p><span class="yuque-card-unsupported">[codeblock]</span>
